# Kontrola jakosci przy kazdym pull requescie.
#
# Progi sa w audyt.py, a nie tutaj: edytor GitHuba przy dluzszych plikach
# zapisuje tylko zaladowana czesc i ucina reszte, co dwa razy uszkodzilo
# krok z basha. Kazdy skrypt sam konczy sie kodem bledu.
name: Kontrola

on:
  pull_request:
  workflow_dispatch:

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dane cennika
        run: python3 kontrola-danych.py

      - name: Budowanie
        run: node build.mjs

      - name: Dane strukturalne
        run: python3 kontrola-schematow.py

      - name: Dostepnosc
        run: python3 kontrola-dostepnosci.py

      - name: Jezyk
        run: python3 narzedzia/jezyk.py

      - name: Szerokosc na waskim ekranie
        run: python3 narzedzia/szerokosc.py

      - name: Dzialanie kalkulatorow
        run: node narzedzia/kalkulatory.mjs

      - name: Audyt i progi jakosci
        run: python3 audyt.py
