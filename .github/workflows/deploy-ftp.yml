# Budowa strony i wysylka na hosting.
# Hosting: ukraine.com.ua, panel adm.tools, konto uageek, serwer Apache.
# Katalog strony: /home/uageek/uslugiceny.pl/www/
#
# Wysylka jest przyrostowa. Build zapisuje tylko strony o zmienionej tresci
# i wypisuje ich liste do zmienione.txt. Workflow wysyla wylacznie te pliki,
# zamiast przechodzic po FTP cale drzewo 1250 stron: samo obejscie katalogow
# przez lftp trwalo kilkanascie minut, nawet gdy nie bylo czego wysylac.
#
# Takze duze zmiany wysylamy wprost z manifestu: mput -d -P 4 tworzy katalogi
# i wysyla do czterech plikow naraz, bez rekurencyjnego porownywania zdalnego drzewa.
#
# Sekrety: Settings > Secrets and variables > Actions
#   FTP_SERVER    uageek.ftp.tools
#   FTP_USER      uageek_usl
#   FTP_PASSWORD  haslo tego uzytkownika
#   FTP_DIR       ./
name: Build and deploy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Odtworz poprzednia wersje dist
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ github.sha }}
          restore-keys: |
            dist-

      - name: Build
        env:
          SITE_URL: https://uslugiceny.pl
          BASE_PATH: /
        run: node build.mjs

      - name: Kontrola wyniku budowy
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/.htaccess
          echo "Stron: $(find dist -name index.html | wc -l)"
          echo "Do wyslania: $(wc -l < zmienione.txt)"

      - name: Instalacja lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Wyslij na hosting
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python3 narzedzia/wyslij-ftp.py

      - name: Sprawdzenie strony
        run: |
          set -euo pipefail
          sprawdzenie=$(mktemp -d)
          for plik in index.html assets/style.css assets/kalkulator.js sitemap.xml sprawdz-oferte/index.html; do
            adres="$plik"
            [ "$plik" = "index.html" ] && adres=""
            mkdir -p "$(dirname "$sprawdzenie/$plik")"
            curl --fail --silent --show-error --retry 3 --retry-delay 3 \
              --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' \
              "https://uslugiceny.pl/$adres?deploy=${GITHUB_SHA}" \
              --output "$sprawdzenie/$plik"
          done
          python3 - "$sprawdzenie/index.html" <<'PY'
          from pathlib import Path
          import re
          import sys
          lokalna = Path('dist/index.html').read_text(encoding='utf-8')
          zdalna = Path(sys.argv[1]).read_text(encoding='utf-8')
          css = re.search(r'/assets/style\.css\?v=[a-f0-9]+', lokalna)
          assert css and css.group() in zdalna, 'Strona nie wskazuje nowej wersji arkusza stylów'
          assert '<body class="home">' in zdalna, 'Nieprawidłowa strona główna'
          print('Strona główna wskazuje wdrożoną wersję stylów.')
          PY
          cmp dist/assets/style.css "$sprawdzenie/assets/style.css"
          cmp dist/assets/kalkulator.js "$sprawdzenie/assets/kalkulator.js"
          cmp dist/sitemap.xml "$sprawdzenie/sitemap.xml"
          cmp dist/sprawdz-oferte/index.html "$sprawdzenie/sprawdz-oferte/index.html"
          echo "HTML, CSS, silnik kalkulatorów, ocena ofert i mapa witryny zweryfikowane dla $GITHUB_SHA"
