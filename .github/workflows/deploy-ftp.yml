# Budowa strony i wysylka na hosting.
# Hosting: ukraine.com.ua, panel adm.tools, konto uageek, serwer Apache.
# Katalog strony: /home/uageek/uslugiceny.pl/www/
#
# Wysylka jest przyrostowa. Build zapisuje tylko strony o zmienionej tresci
# i wypisuje ich liste do zmienione.txt. Workflow wysyla wylacznie te pliki,
# zamiast przechodzic po FTP cale drzewo 1250 stron: samo obejscie katalogow
# przez lftp trwalo kilkanascie minut, nawet gdy nie bylo czego wysylac.
#
# Gdy zmian jest duzo (np. po zmianie arkusza stylow, ktory wystepuje w kazdej
# stronie), oplaca sie zwykly mirror i wtedy workflow przelacza sie na niego.
#
# Sekrety: Settings > Secrets and variables > Actions
#   FTP_SERVER    uageek.ftp.tools
#   FTP_USER      uageek_usl
#   FTP_PASSWORD  haslo tego uzytkownika
#   FTP_DIR       ./
name: Build and deploy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Odtworz poprzednia wersje dist
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ github.sha }}
          restore-keys: |
            dist-

      - name: Build
        env:
          SITE_URL: https://uslugiceny.pl
          BASE_PATH: /
        run: node build.mjs

      - name: Kontrola wyniku budowy
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/.htaccess
          echo "Stron: $(find dist -name index.html | wc -l)"
          echo "Do wyslania: $(wc -l < zmienione.txt)"

      - name: Instalacja lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Wyslij na hosting
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USER }}
          PASS: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -e
          ILE=$(wc -l < zmienione.txt)
          USTAWIENIA="set ftp:ssl-allow true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 5; set net:reconnect-interval-base 5; set net:timeout 30; set cmd:fail-exit true;"

          if [ "$ILE" -gt 400 ]; then
            echo "Zmian: $ILE, uzywam pelnego mirrora"
            lftp -c "$USTAWIENIA set mirror:parallel-transfer-count 4; open -u '$USER','$PASS' '$HOST'; mirror -R --only-newer --no-perms --verbose=1 dist/ '$DIR'; bye"
          else
            echo "Zmian: $ILE, wysylam pojedyncze pliki"
            {
              echo "$USTAWIENIA"
              echo "open -u '$USER','$PASS' '$HOST';"
              echo "cd '$DIR';"
              while read -r f; do
                [ -z "$f" ] && continue
                [ -f "dist/$f" ] || continue
                d=$(dirname "$f")
                if [ "$d" != "." ]; then echo "mkdir -p -f '$d';"; fi
                echo "put -O '$d' 'dist/$f';"
              done < zmienione.txt
              echo "bye"
            } > /tmp/polecenia.lftp
            lftp -f /tmp/polecenia.lftp
          fi

      - name: Sprawdzenie strony
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://uslugiceny.pl/)
          echo "Strona glowna: $code"
          test "$code" = "200"
