# Kontrola przy kazdym pull requescie. Cztery niezalezne warstwy:
# dane cennika, wygenerowane strony, dane strukturalne i dostepnosc.
name: Build check








on:
  pull_request:
  workflow_dispatch:








jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22








      - name: Spojnosc danych cennika
        run: python3 kontrola-danych.py








      - name: Budowanie
        run: node build.mjs








      - name: Tylko polski w wygenerowanych stronach
        run: |
          # -I pomija pliki binarne: bajty ikon PNG potrafia trafic w zakres cyrylicy
          if grep -rlIP '[\x{0400}-\x{04FF}]' dist/ ; then
            echo "Znaleziono cyrylice w plikach tekstowych dist/"; exit 1
          fi
          echo "OK, wylacznie polski"








      - name: Dane strukturalne
        run: python3 kontrola-schematow.py








      - name: Dostepnosc
        run: python3 kontrola-dostepnosci.py


      - name: Jezyk
        run: python3 narzedzia/jezyk.py

      - name: Szerokosc na waskim ekranie
        run: python3 narzedzia/szerokosc.py








      - name: Dzialanie kalkulatorow
        run: node narzedzia/kalkulatory.mjs

      - name: Audyt metadanych i odnosnikow
        run: python3 audyt.py | tee /tmp/wynik.txt








      - name: Progi jakosci
        run: |
          fail=0
          sprawdz () {
            n=$(grep -oP "$1: \K[0-9]+" /tmp/wynik.txt | head -1)
