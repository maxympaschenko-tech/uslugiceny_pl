name: Skilky live probe

on:
  push:
    branches:
      - ops-skilky-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Skilky production
        shell: bash
        run: |
          set -u
          set -o pipefail
          base='https://skilky.com.ua'
          nonce="$(date +%s)"
          failures=0

          echo '=== deploy-status.json ==='
          curl -LfsS --retry 2 --retry-delay 1 --max-time 15 -H 'Cache-Control: no-cache' "${base}/deploy-status.json?probe=${nonce}" || true
          echo
          echo '=== build.json ==='
          curl -LfsS --retry 2 --retry-delay 1 --max-time 15 -H 'Cache-Control: no-cache' "${base}/build.json?probe=${nonce}" || true
          echo

          surface() {
            local path="$1" marker="$2" tmp
            tmp="$(mktemp)"
            if ! curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}${path}?probe=${nonce}" -o "$tmp"; then
              echo "FAIL HTTP surface ${path}"
              failures=$((failures + 1))
            elif grep -Fq "$marker" "$tmp"; then
              echo "PASS surface ${path} :: ${marker}"
            else
              echo "FAIL marker ${path} :: ${marker}"
              failures=$((failures + 1))
            fi
            rm -f "$tmp"
          }

          redirect() {
            local path="$1" expected="$2" headers status location normalized
            headers="$(mktemp)"
            if ! curl -sS --retry 2 --retry-delay 1 --max-time 20 -D "$headers" -o /dev/null "${base}${path}"; then
              echo "FAIL HTTP redirect ${path}"
              failures=$((failures + 1))
              rm -f "$headers"
              return
            fi
            status="$(awk '/^HTTP\// {code=$2} END {print code}' "$headers")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^Location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END {print value}' "$headers")"
            rm -f "$headers"
            normalized="$location"
            case "$normalized" in "$base"*) normalized="${normalized#"$base"}" ;; esac
            normalized="${normalized%%\?*}"
            normalized="${normalized%%\#*}"
            if [ "$status" = '301' ] && [ "$normalized" = "$expected" ]; then
              echo "PASS redirect ${path} -> ${expected}"
            else
              echo "FAIL redirect ${path} status=${status:-missing} location=${location:-missing} expected=${expected}"
              failures=$((failures + 1))
            fi
          }

          surface '/' 'Калькулятори та перевірені ціни для дому, ремонту, авто й фінансів'
          surface '/' '282 практичні калькулятори для ремонту, будівництва, дому, авто та фінансів плюс локальні довідники цін: 22 міста України.'
          surface '/kalkulyator/generator/' 'Калькулятор потужності генератора для будинку'
          surface '/kalkulyator/ups-invertor/' 'Калькулятор акумулятора для UPS та інвертора'
          surface '/kalkulyator/teplovtraty/' 'Калькулятор тепловтрат і потужності опалення кімнати'
          surface '/kalkulyator/radiatory/' 'Калькулятор кількості секцій радіатора опалення'
          surface '/kalkulyator/sonyachni-paneli/' 'Калькулятор сонячних панелей для будинку'
          surface '/kalkulyator/zaryadka-elektromobilya/' 'Калькулятор зарядки електромобіля вдома'
          redirect '/kalkulyator/generator-dlya-budynku/' '/kalkulyator/generator/'
          redirect '/kalkulyator/akumulyator-dlya-ups/' '/kalkulyator/ups-invertor/'
          redirect '/kalkulyator/teplova-potuzhnist-kimnaty/' '/kalkulyator/teplovtraty/'
          redirect '/kalkulyator/sektsii-radiatora/' '/kalkulyator/radiatory/'
          redirect '/kalkulyator/sonyachna-stantsiya-dlya-budynku/' '/kalkulyator/sonyachni-paneli/'
          redirect '/kalkulyator/zaryadka-ev-vdoma/' '/kalkulyator/zaryadka-elektromobilya/'
          surface '/tsiny/' '<strong>22</strong><span>міста з окремими даними</span>'
          surface '/tsiny/' 'data-stage23-city="zaporizhzhia"'
          surface '/tsiny/' 'data-stage23-city="kryvyi-rih"'
          surface '/privacy/' 'Ця сторінка описує роботу сервісу «Скільки?» та правила обробки технічних даних'
          surface '/sitemap.xml' '<loc>https://skilky.com.ua/privacy/</loc><lastmod>2026-08-30</lastmod>'
          surface '/kalkulyator/dytyachi-vyplaty-kalkulyator/' 'id="childBenefitsNurseryMonths"'
          surface '/kalkulyatory/finansy/' '<strong>8 000 / 12 000 грн/міс</strong>'
          surface '/kalkulyator/dytyachi-vyplaty-kalkulyator/' 'id="childBenefitsBabyBoxMode"'
          surface '/kalkulyatory/finansy/' '<strong>8 451 грн/дитина</strong>'
          surface '/kalkulyator/dekretni-kalkulyator/' 'id="maternityInsuranceMode"'
          surface '/kalkulyatory/finansy/' '<strong>7 000 грн/міс</strong>'
          surface '/kalkulyator/pakunok-shkolyara-2026-kalkulyator/' 'id="schoolPackageCount"'
          surface '/kalkulyatory/finansy/' '<strong>5 000 грн/першокласника</strong>'
          surface '/kalkulyator/bazova-sotsialna-dopomoga-kalkulyator/' 'id="bsaApplicantCategory"'
          surface '/kalkulyatory/finansy/' '<strong>4 500 грн базова величина</strong>'
          surface '/kalkulyator/zhytlova-subsydiya-2026-kalkulyator/' 'id="housingSubsidyMembers"'
          surface '/kalkulyatory/finansy/' '<strong>3 209 грн база формули</strong>'
          surface '/tsiny/fundament-budynku/zaporizhzhia/' 'stage136-foundation-guide'
          surface '/tsiny/fundament-budynku/kryvyi-rih/' 'stage136-foundation-guide'
          surface '/tsiny/kryvyi-rih/' 'stage175-city-hub-expanded-guides'
          surface '/sitemap.xml' 'https://skilky.com.ua/tsiny/fundament-budynku/zaporizhzhia/'
          surface '/sitemap.xml' 'https://skilky.com.ua/tsiny/fundament-budynku/kryvyi-rih/'
          surface '/sitemap.xml' 'stage301-finance-sitemap-route-parity routes=29'
          surface '/sitemap.xml' 'https://skilky.com.ua/kalkulyator/podatky-z-orendy-nerukhomosti-kalkulyator/'
          surface '/sitemap.xml' 'https://skilky.com.ua/kalkulyator/pakunok-shkolyara-2026-kalkulyator/'
          surface '/sitemap.xml' 'https://skilky.com.ua/kalkulyator/bazova-sotsialna-dopomoga-kalkulyator/'
          surface '/sitemap.xml' 'https://skilky.com.ua/kalkulyator/zhytlova-subsydiya-2026-kalkulyator/'

          echo "SMOKE_FAILURES=${failures}"
          exit 0
