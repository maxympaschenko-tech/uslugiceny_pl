name: Skilky live probe

on:
  push:
    branches:
      - ops-skilky-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Skilky production
        shell: bash
        run: |
          set -euo pipefail
          base='https://skilky.com.ua'
          nonce="$(date +%s)"

          echo '=== deploy-status.json ==='
          curl -LfsS --retry 2 --retry-delay 1 --max-time 15 -H 'Cache-Control: no-cache' "${base}/deploy-status.json?probe=${nonce}"
          echo
          echo '=== build.json ==='
          curl -LfsS --retry 2 --retry-delay 1 --max-time 15 -H 'Cache-Control: no-cache' "${base}/build.json?probe=${nonce}"
          echo

          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/?probe=${nonce}" -o /tmp/home.html
          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/kalkulyatory/?probe=${nonce}" -o /tmp/catalog.html
          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/kalkulyatory/dim/?probe=${nonce}" -o /tmp/dim.html
          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/kalkulyatory/remont/?probe=${nonce}" -o /tmp/remont.html
          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/kalkulyator/ups-invertor/?probe=${nonce}" -o /tmp/ups.html

          python3 - <<'PY'
          import collections, html, json, re, sys
          from pathlib import Path

          home = Path('/tmp/home.html').read_text(encoding='utf-8')
          catalog = Path('/tmp/catalog.html').read_text(encoding='utf-8')
          dim = Path('/tmp/dim.html').read_text(encoding='utf-8')
          remont = Path('/tmp/remont.html').read_text(encoding='utf-8')
          ups = Path('/tmp/ups.html').read_text(encoding='utf-8')

          def clean(s):
              return html.unescape(re.sub(r'<[^>]+>', '', s)).strip()

          category_block_match = re.search(r'<div class="category-cards">(.*?)</div></div></section>', home, re.S)
          category_block = category_block_match.group(1) if category_block_match else ''
          home_categories = {}
          for name, count in re.findall(r'<b>(.*?)</b>\s*<small>\s*(\d+)\s+калькулятор', category_block, re.S):
              home_categories[clean(name)] = int(count)

          catalog_categories = collections.Counter()
          catalog_urls = set()
          for tag in re.findall(r'<a\b[^>]*class="[^"]*\btool-card\b[^"]*"[^>]*>', catalog, re.I):
              href = re.search(r'href="(/kalkulyator/[a-z0-9-]+/)"', tag, re.I)
              category = re.search(r'data-category="([^"]+)"', tag, re.I)
              if not href or not category:
                  continue
              url = href.group(1)
              if url in catalog_urls:
                  continue
              catalog_urls.add(url)
              catalog_categories[html.unescape(category.group(1))] += 1

          search_items = {}
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', home, re.S | re.I)
          for script in scripts:
              base_match = re.search(r'window\.SKILKY_CALCULATORS\s*=\s*(\[.*?\])\s*;', script, re.S)
              if base_match:
                  try:
                      rows = json.loads(base_match.group(1))
                  except Exception:
                      rows = []
                  for row in rows if isinstance(rows, list) else []:
                      if isinstance(row, dict) and str(row.get('url', '')).startswith('/kalkulyator/'):
                          search_items[str(row['url'])] = row
              for push_match in re.finditer(r'window\.SKILKY_CALCULATORS\.push\(\.\.\.(\[.*?\])\)\s*;', script, re.S):
                  try:
                      rows = json.loads(push_match.group(1))
                  except Exception:
                      rows = []
                  for row in rows if isinstance(rows, list) else []:
                      if isinstance(row, dict) and str(row.get('url', '')).startswith('/kalkulyator/'):
                          search_items[str(row['url'])] = row

          search_categories = collections.Counter()
          for row in search_items.values():
              category = str(row.get('category', '')).strip()
              if category:
                  search_categories[category] += 1

          print('HOME_CATEGORY_COUNTS:', dict(home_categories))
          print('CATALOG_CATEGORY_COUNTS:', dict(catalog_categories))
          print('CATALOG_UNIQUE_TOTAL:', len(catalog_urls))
          print('HOME_CATEGORY_PARITY:', home_categories == dict(catalog_categories))
          print('SEARCH_CATEGORY_COUNTS:', dict(search_categories))
          print('SEARCH_UNIQUE_TOTAL:', len(search_items))
          print('SEARCH_CATALOG_URL_PARITY:', set(search_items) == catalog_urls)
          print('SEARCH_CATALOG_CATEGORY_PARITY:', dict(search_categories) == dict(catalog_categories))

          def upper(text, label):
              for m in re.finditer(r'<div class="seo-cluster-card">(.*?)</div></div>', text, re.S):
                  block = m.group(0)
                  h = re.search(r'<h3>(.*?)</h3>', block, re.S)
                  if h and clean(h.group(1)) == label:
                      return block
              return ''

          def lower(text, label):
              for m in re.finditer(r'<article class="seo-topic-block"[^>]*>(.*?)</article>', text, re.S):
                  block = m.group(0)
                  h = re.search(r'<h2>\s*Калькулятори:\s*(.*?)</h2>', block, re.S)
                  if h and clean(h.group(1)) == label:
                      return block
              return ''

          def links(block):
              return [(href, clean(body)) for href, body in re.findall(r'<a[^>]*href="([^"]+)"[^>]*>(.*?)</a>', block, re.S) if href.startswith('/kalkulyator/')]

          bad = {
              '/kalkulyator/ochyshchuvach-povitrya-cadr/',
              '/kalkulyator/ups-invertor/',
              '/kalkulyator/boyler/',
              '/kalkulyator/akustychni-paneli-na-stinu/',
              '/kalkulyator/remont-vannoi-kalkulyator/',
              '/kalkulyator/remont-kukhni-kalkulyator/',
              '/kalkulyator/vagonka-na-stiny/',
              '/kalkulyator/hermetyk-dlya-shviv/',
          }

          failures = []
          for page, text in [('DIM', dim), ('REMONT', remont)]:
              for surface, block in [('UPPER', upper(text, 'Геометрія та площі')), ('LOWER', lower(text, 'Геометрія та площі'))]:
                  leaked = [item for item in links(block) if item[0] in bad]
                  print(f'{page}_{surface}_BAD:', leaked)
                  if leaked:
                      failures.append(f'{page}_{surface}:{leaked}')

          print('UPS_RUNTIME_MARKER:', 'id="upsPeak"' in ups)
          if 'id="upsPeak"' not in ups:
              failures.append('UPS runtime marker id="upsPeak" missing')

          if failures:
              print('FAILURES:', failures)
              sys.exit(1)
          print('SEMANTIC_PROBE_OK')
          PY
