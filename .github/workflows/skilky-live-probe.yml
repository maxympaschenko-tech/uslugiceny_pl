name: Skilky live probe

on:
  push:
    branches:
      - ops-skilky-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Skilky production
        shell: bash
        run: |
          set -euo pipefail
          base='https://skilky.com.ua'
          nonce="$(date +%s)"

          echo '=== deploy-status.json ==='
          curl -LfsS --retry 2 --retry-delay 1 --max-time 15 -H 'Cache-Control: no-cache' "${base}/deploy-status.json?probe=${nonce}"
          echo
          echo '=== build.json ==='
          curl -LfsS --retry 2 --retry-delay 1 --max-time 15 -H 'Cache-Control: no-cache' "${base}/build.json?probe=${nonce}"
          echo

          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/?probe=${nonce}" -o /tmp/skilky-home.html
          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/kalkulyatory/dim/?probe=${nonce}" -o /tmp/skilky-dim.html
          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/kalkulyatory/remont/?probe=${nonce}" -o /tmp/skilky-remont.html

          python3 - <<'PY'
          import re
          from pathlib import Path

          home = Path('/tmp/skilky-home.html').read_text(encoding='utf-8')
          dim = Path('/tmp/skilky-dim.html').read_text(encoding='utf-8')
          remont = Path('/tmp/skilky-remont.html').read_text(encoding='utf-8')

          def marker(text, name):
              m = re.search(re.escape(name) + r'[^>\n]*', text)
              return m.group(0) if m else 'missing'

          def upper(text, label):
              for m in re.finditer(r'<div class="seo-cluster-card">(.*?)</div></div>', text, re.S):
                  block = m.group(0)
                  heading = re.search(r'<h3>(.*?)</h3>', block, re.S)
                  if heading and re.sub(r'<[^>]+>', '', heading.group(1)).strip() == label:
                      return block
              return ''

          def lower(text, label):
              for m in re.finditer(r'<article class="seo-topic-block"[^>]*>(.*?)</article>', text, re.S):
                  block = m.group(0)
                  heading = re.search(r'<h2>\s*Калькулятори:\s*(.*?)</h2>', block, re.S)
                  if heading and re.sub(r'<[^>]+>', '', heading.group(1)).strip() == label:
                      return block
              return ''

          def hits(block, labels):
              return [label for label in labels if label in block]

          geometry_bad = ['CADR очищувача повітря', 'UPS / інвертор', 'Бойлер', 'Акустичні панелі', 'Бюджет ванної', 'Бюджет кухні']
          print('HOME_STAGE64:', marker(home, 'stage64-count-normalized'))
          print('HOME_STAGE279:', marker(home, 'stage279-home-semantic-finalizer'))
          print('DIM_UPPER_GEOMETRY_BAD:', hits(upper(dim, 'Геометрія та площі'), geometry_bad))
          print('DIM_LOWER_GEOMETRY_BAD:', hits(lower(dim, 'Геометрія та площі'), geometry_bad))
          print('DIM_UPPER_GARDEN_AQUARIUM:', 'Об’єм акваріума' in upper(dim, 'Сад і ділянка'))
          print('DIM_LOWER_GARDEN_AQUARIUM:', 'Об’єм акваріума' in lower(dim, 'Сад і ділянка'))
          print('REMONT_UPPER_GEOMETRY_BAD:', hits(upper(remont, 'Геометрія та площі'), geometry_bad))
          print('REMONT_LOWER_GEOMETRY_BAD:', hits(lower(remont, 'Геометрія та площі'), geometry_bad))
          PY
