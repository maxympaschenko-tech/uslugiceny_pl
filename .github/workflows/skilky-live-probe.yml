name: Skilky live probe

on:
  push:
    branches:
      - ops-skilky-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Skilky production
        shell: bash
        run: |
          set -euo pipefail
          base='https://skilky.com.ua'
          nonce="$(date +%s)"

          echo '=== deploy-status.json ==='
          curl -LfsS --retry 2 --retry-delay 1 --max-time 15 -H 'Cache-Control: no-cache' "${base}/deploy-status.json?probe=${nonce}"
          echo
          echo '=== build.json ==='
          curl -LfsS --retry 2 --retry-delay 1 --max-time 15 -H 'Cache-Control: no-cache' "${base}/build.json?probe=${nonce}"
          echo

          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/kalkulyatory/dim/?probe=${nonce}" -o /tmp/dim.html
          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/kalkulyatory/remont/?probe=${nonce}" -o /tmp/remont.html
          curl -LfsS --retry 2 --retry-delay 1 --max-time 20 -H 'Cache-Control: no-cache' "${base}/kalkulyator/ups-invertor/?probe=${nonce}" -o /tmp/ups.html

          python3 - <<'PY'
          import html, re, sys
          from pathlib import Path

          dim = Path('/tmp/dim.html').read_text(encoding='utf-8')
          remont = Path('/tmp/remont.html').read_text(encoding='utf-8')
          ups = Path('/tmp/ups.html').read_text(encoding='utf-8')

          def clean(s):
              return html.unescape(re.sub(r'<[^>]+>', '', s)).strip()

          def upper(text, label):
              for m in re.finditer(r'<div class="seo-cluster-card">(.*?)</div></div>', text, re.S):
                  block = m.group(0)
                  h = re.search(r'<h3>(.*?)</h3>', block, re.S)
                  if h and clean(h.group(1)) == label:
                      return block
              return ''

          def lower(text, label):
              for m in re.finditer(r'<article class="seo-topic-block"[^>]*>(.*?)</article>', text, re.S):
                  block = m.group(0)
                  h = re.search(r'<h2>\s*Калькулятори:\s*(.*?)</h2>', block, re.S)
                  if h and clean(h.group(1)) == label:
                      return block
              return ''

          def links(block):
              return [(href, clean(body)) for href, body in re.findall(r'<a[^>]*href="([^"]+)"[^>]*>(.*?)</a>', block, re.S) if href.startswith('/kalkulyator/')]

          bad = {
              '/kalkulyator/ochyshchuvach-povitrya-cadr/',
              '/kalkulyator/ups-invertor/',
              '/kalkulyator/boyler/',
              '/kalkulyator/akustychni-paneli-na-stinu/',
              '/kalkulyator/remont-vannoi-kalkulyator/',
              '/kalkulyator/remont-kukhni-kalkulyator/',
              '/kalkulyator/vagonka-na-stiny/',
              '/kalkulyator/hermetyk-dlya-shviv/',
          }

          failures = []
          for page, text in [('DIM', dim), ('REMONT', remont)]:
              for surface, block in [('UPPER', upper(text, 'Геометрія та площі')), ('LOWER', lower(text, 'Геометрія та площі'))]:
                  found = links(block)
                  leaked = [item for item in found if item[0] in bad]
                  print(f'{page}_{surface}_GEOMETRY_LINKS:', found)
                  print(f'{page}_{surface}_BAD:', leaked)
                  if leaked:
                      failures.append(f'{page}_{surface}:{leaked}')

          print('UPS_RUNTIME_MARKER:', 'id="upsPeak"' in ups)
          h1 = re.search(r'<h1>(.*?)</h1>', ups, re.S)
          print('UPS_H1:', clean(h1.group(1)) if h1 else 'missing')
          if 'id="upsPeak"' not in ups:
              failures.append('UPS runtime marker id="upsPeak" missing')

          if failures:
              print('FAILURES:', failures)
              sys.exit(1)
          print('SEMANTIC_PROBE_OK')
          PY
